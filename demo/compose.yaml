# The UI, layered onto the real stack:
#
#   docker compose -f compose.yaml -f demo/compose.yaml up --build
#
# Needs a DESTINY login first (`uv run python -m research_mapper login`) and the
# usual MAPPER_LLM_* variables, both read from ./.env.

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-mapper:local
    command:
      ["python", "demo/serve.py", "--host", "0.0.0.0", "--api", "http://api:8080"]
    volumes:
      - ./demo:/app/demo:ro
    ports:
      - "${DEMO_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
