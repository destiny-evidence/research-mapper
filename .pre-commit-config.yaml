repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7  # keep in step with the ruff in uv.lock, which CI runs
    hooks:
      - id: ruff          # linter — catches style/logic issues
        args: [--fix]
      - id: ruff-format   # formatter — like black, enforces consistent style
  - repo: local
    hooks:
      - id: pytest-unit
        name: unit-tests
        entry: scripts/run-unit-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true