repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2  # use latest stable tag
    hooks:
      - id: ruff          # linter — catches style/logic issues
      - id: ruff-format   # formatter — like black, enforces consistent style
  - repo: local
    hooks:
      - id: pytest-unit
        name: unit-tests
        entry: scripts/run-unit-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true