[project]
name = "research-mapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.19.0",
    "destiny-sdk>=0.13.0",
    "dspy>=3.1.3",
    "httpx>=0.28.1",
    "luqum>=1.0.0",
    "pydantic>=2.12.5",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0",
    "pyld>=3.1.0",
    "rich>=14.3.3",
    "rispy>=0.10.0",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.4",
    "pgqueuer>=1.3.2",
]

[project.scripts]
research-mapper = "research_mapper.cli:run"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "ruff>=0.15.7",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = ["dspy.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests requiring live .env credentials",
]
pythonpath = ["tests"]
