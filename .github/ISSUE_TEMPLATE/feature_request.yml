name: Feature request
description: Suggest a new feature or capability
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check existing issues first to avoid duplicates.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues and this hasn't been requested yet
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or frustration behind the request, not the solution yet.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Be as specific as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this relate to?
      options:
        - Web UI
        - Terminal app / CLI
        - API
        - Workflows / engine
        - Database
        - DESTINY integration
        - Infrastructure / deployment
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would improve my workflow
        - Blocking me
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links or examples from other tools.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this
          required: false
