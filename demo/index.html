<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>research-mapper</title>
<style>
:root{
  --bg:#0a0e13; --panel:#101720; --panel-2:#0d141b; --line:#1d2733; --line-2:#2a3746;
  --text:#e6edf5; --muted:#8ba0b6; --dim:#5b7086;
  --machine:#5eead4; --human:#fbbf24; --ok:#4ade80; --bad:#f87171;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--machine)}

#app{display:grid;grid-template-columns:290px 1fr;height:100%}
#app[hidden]{display:none}

/* ---------- sidebar ---------- */
aside{
  border-right:1px solid var(--line); background:var(--panel-2);
  overflow:auto; padding:20px 18px; display:flex; flex-direction:column; gap:22px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--machine);box-shadow:0 0 12px var(--machine)}
.brand small{color:var(--dim);font-weight:400;letter-spacing:0}
.rail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rail li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:7px 0;position:relative}
.rail li::before{content:"";position:absolute;left:10px;top:26px;bottom:-7px;width:1px;background:var(--line)}
.rail li:last-child::before{display:none}
.pip{
  width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line-2);
  display:grid;place-items:center;font-size:11px;color:var(--dim);background:var(--panel-2);z-index:1;
}
.step-name{font-size:13.5px;color:var(--muted);line-height:1.35}
.step-note{font-size:11.5px;color:var(--dim);margin-top:1px}
li.s-complete .pip{border-color:var(--ok);color:var(--ok)}
li.s-complete .step-name{color:var(--text)}
li.s-running .pip{border-color:var(--machine);color:var(--machine);animation:pulse 1.4s ease-in-out infinite}
li.s-running .step-name{color:var(--machine)}
li.s-pending_run .pip{border-color:var(--machine);color:var(--machine);opacity:.55}
li.s-awaiting_input .pip{border-color:var(--human);color:var(--human);background:rgba(251,191,36,.12)}
li.s-awaiting_input .step-name{color:var(--human)}
li.s-failed .pip{border-color:var(--bad);color:var(--bad)}
li.s-failed .step-name{color:var(--bad)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(94,234,212,.35)}50%{box-shadow:0 0 0 5px rgba(94,234,212,0)}}

.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:9px}
.artifacts{display:flex;flex-direction:column;gap:2px}
.artifact{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:5px 8px;border-radius:7px;border:0;background:transparent;text-align:left;
  font-size:12.5px;color:var(--muted);width:100%;
}
.artifact:hover{background:var(--panel);color:var(--text)}
.artifact .v{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:0 6px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.toggle input{accent-color:var(--machine)}

/* ---------- main ---------- */
main{overflow:auto}
.wrap{max-width:1080px;padding:26px 34px 80px}
header.page{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
.question{font-size:20px;font-weight:600;letter-spacing:-.015em;max-width:64ch}
.sub{color:var(--dim);font-size:12.5px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:5px 13px;border-radius:6px;font-size:13px}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.tabs button[disabled]{opacity:.35;cursor:default}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
.card.human{border-color:rgba(251,191,36,.4);box-shadow:0 0 0 1px rgba(251,191,36,.08),0 10px 30px -20px rgba(251,191,36,.5)}
.card.bad{border-color:rgba(248,113,113,.45)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card-h h2{font-size:16px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line-2);color:var(--dim)}
.tag.human{border-color:rgba(251,191,36,.45);color:var(--human);background:rgba(251,191,36,.08)}
.tag.machine{border-color:rgba(94,234,212,.4);color:var(--machine);background:rgba(94,234,212,.07)}
.tag.bad{border-color:rgba(248,113,113,.45);color:var(--bad)}
.blurb{color:var(--muted);font-size:13.5px;margin:0 0 14px}

.bar{height:5px;background:var(--panel-2);border-radius:20px;overflow:hidden;border:1px solid var(--line);margin:14px 0 8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,var(--machine));transition:width .4s ease}
.bar.indet>i{width:100%;background:linear-gradient(90deg,rgba(94,234,212,.12),var(--machine),rgba(94,234,212,.12));background-size:220% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{0%{background-position:110% 0}100%{background-position:-110% 0}}
.bar-note{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.chip b{color:var(--text);font-weight:600}

/* options */
.opts{display:flex;flex-direction:column;gap:7px;margin:6px 0 0}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--line-2)}
.opt input{margin-top:3px;accent-color:var(--human);flex:none}
.opt.on{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.05)}
.opt .lbl{font-size:13.5px;word-break:break-word}
.opt .lbl.q{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#a5e8ff}
.opt.dis{opacity:.4;cursor:not-allowed}

.rows{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fields{display:flex;flex-direction:column;gap:6px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:2px}
input[type=text],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:7px 9px;font:inherit;font-size:13.5px;
}
textarea{resize:vertical;min-height:52px;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--machine)}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:6px;padding:4px 9px;font-size:12px}
.icon-btn:hover{color:var(--bad);border-color:rgba(248,113,113,.4)}

.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--human);color:#20160a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default;filter:none}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.hint{color:var(--dim);font-size:12px}

.done-list{display:flex;flex-direction:column;gap:1px;margin-top:26px}
.done-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:10px}
.done{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:13px;margin-bottom:6px}
.done .nm{color:var(--muted);flex:1}
.done .tick{color:var(--ok)}

/* ---------- map ---------- */
.map-controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.control{display:flex;flex-direction:column;gap:5px}
.control label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
.control select{min-width:180px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f-chip{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:20px;padding:4px 11px;font-size:12.5px}
.f-chip.on{border-color:var(--machine);color:var(--machine);background:rgba(94,234,212,.08)}
.grid-scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table.map{border-collapse:separate;border-spacing:0;width:100%}
table.map th,table.map td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.map th{background:var(--panel-2);font-weight:500;font-size:12.5px;color:var(--muted);padding:10px 12px;text-align:left;vertical-align:bottom}
table.map thead th{position:sticky;top:0;z-index:2}
table.map tbody th{position:sticky;left:0;z-index:1;min-width:170px;max-width:230px;vertical-align:middle}
table.map thead th:first-child{left:0;z-index:3;color:var(--dim)}
table.map td{padding:0;text-align:center;height:74px;min-width:118px}
.cell{width:100%;height:74px;border:0;background:transparent;display:grid;place-items:center}
.cell:hover{background:rgba(94,234,212,.05)}
.bubble{border-radius:50%;background:rgba(94,234,212,.16);border:1px solid rgba(94,234,212,.5);color:var(--machine);display:grid;place-items:center;font-size:12.5px;font-weight:600;transition:transform .15s}
.cell:hover .bubble{transform:scale(1.08)}
.cell.sel .bubble{background:var(--machine);color:#04201c;border-color:var(--machine)}
.gap{color:#2f3d4c;font-size:15px}
.cell.sel.empty{background:rgba(94,234,212,.06)}

.papers{margin-top:16px}
.paper{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:13px 15px;margin-bottom:8px}
.paper .t{font-size:13.5px;font-weight:500;line-height:1.4}
.paper .m{font-size:12px;color:var(--dim);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.paper .coord{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.coord span{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.coord span b{color:var(--dim);font-weight:400}

/* ---------- start screen ---------- */
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1000px 600px at 50% -10%,#132029,var(--bg));padding:24px;overflow:auto}
#start[hidden]{display:none}
.start-card{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:0 40px 80px -40px #000}
.start-card h1{font-size:22px;margin-bottom:6px}
.start-card p.lede{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.start-card .field{margin-bottom:16px}
.recent{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.recent button{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;color:var(--muted);font-size:13px}
.recent button:hover{border-color:var(--line-2);color:var(--text)}
.recent .when{font-size:11.5px;color:var(--dim);margin-top:2px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(4,7,10,.72);display:grid;place-items:center;padding:32px;z-index:50}
#modal[hidden]{display:none}
.modal-card{width:min(880px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:20px 22px}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6;color:#b9d4e6;white-space:pre-wrap;word-break:break-word}
.empty-state{color:var(--dim);font-size:13.5px;text-align:center;padding:50px 0}
</style>
</head>
<body>

<div id="start">
  <div class="start-card">
    <h1>research-mapper</h1>
    <p class="lede">Ask a research question. The agent drafts searches, screens what it finds, and places it on an evidence map — stopping to ask you whenever a decision is yours.</p>
    <div class="field">
      <label for="q">Research question</label>
      <textarea id="q" rows="3" placeholder="What is known about HPV vaccine uptake among adolescents in school settings?"></textarea>
    </div>
    <div class="field">
      <label for="community">Community</label>
      <select id="community"><option value="hpv">hpv</option><option value="esea">esea</option></select>
    </div>
    <div class="actions">
      <button class="btn primary" id="go">Start mapping</button>
      <span class="hint" id="start-hint"></span>
    </div>
    <div class="recent" id="recent" hidden>
      <div class="side-h">Pick up where you left off</div>
      <div id="recent-list"></div>
    </div>
  </div>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand"><span class="dot"></span> research-mapper <small>demo</small></div>
    <div>
      <div class="side-h">Pipeline</div>
      <ul class="rail" id="rail"></ul>
    </div>
    <div>
      <div class="side-h">Artifacts</div>
      <div class="artifacts" id="artifacts"></div>
    </div>
    <div class="side-foot">
      <label class="toggle"><input type="checkbox" id="auto" checked> run the next step automatically</label>
      <button class="btn ghost" id="new-session">New session</button>
    </div>
  </aside>
  <main>
    <div class="wrap">
      <header class="page">
        <div>
          <div class="question" id="question"></div>
          <div class="sub" id="sub"></div>
        </div>
        <div class="tabs">
          <button id="tab-run" class="on">Run</button>
          <button id="tab-map" disabled>Map</button>
        </div>
      </header>
      <div id="view-run"></div>
      <div id="view-map" hidden></div>
    </div>
  </main>
</div>

<div id="modal" hidden>
  <div class="modal-card">
    <div class="modal-h"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close">close</button></div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
