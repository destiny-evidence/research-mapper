[project]
name = "research-mapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.19.0",
    "destiny-sdk>=0.13.0",
    "dspy>=3.1.3",
    "httpx>=0.28.1",
    "luqum>=1.0.0",
    "pydantic>=2.12.5",
    "psycopg[binary]>=3.2.0",
    "pyld>=3.1.0",
    "rdflib>=7.1.1",
    "rich>=14.3.3",
    "rispy>=0.10.0",
    "uuid>=1.30",
]

[project.scripts]
research-mapper = "research_mapper.cli:run"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests requiring live .env credentials",
]
