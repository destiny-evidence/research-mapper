<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>research-mapper</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --panel-2:#fafbfc;
  --line:#e3e6ea; --line-2:#cfd4db;
  --ink:#141b2a; --text:#333d4e; --muted:#6c7686; --dim:#9aa3b1;
  --navy:#1d2b4d; --navy-2:#2c4372; --navy-wash:#eef1f7;
  --amber:#9a5b06; --amber-wash:#fdf5e9; --amber-line:#e6cfa6;
  --ok:#186b45; --bad:#a92d24;
  --serif:"Source Serif 4","Source Serif Pro",Charter,"Iowan Old Style",Georgia,ui-serif,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;color:var(--ink);letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy-2)}
.mono{font-family:var(--mono)}

/* labels: small, uppercase, monospace — the repository's tell */
.side-h,.done-h,.control label,.field label,.opt .lbl.q{font-family:var(--mono)}
.side-h,.done-h,.control label,.field label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
}
.side-h,.done-h{margin-bottom:10px}

#app{display:none;grid-template-rows:auto 1fr;height:100%}
#app:not([hidden]){display:grid}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:28px;padding:0 22px;height:58px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:16px;color:var(--ink)}
.mark{
  width:24px;height:24px;border-radius:6px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600;
}
.brand .sep{color:var(--line-2)}
.brand .ctx{color:var(--muted)}
.tabs{display:flex;gap:26px;margin:0 auto;height:100%}
.tabs button{
  border:0;background:none;padding:0;height:100%;font-size:12px;font-weight:500;
  text-transform:uppercase;letter-spacing:.11em;color:var(--muted);border-bottom:2px solid transparent;
}
.tabs button.on{color:var(--ink);border-bottom-color:var(--navy)}
.tabs button[disabled]{opacity:.4;cursor:default}
.topmeta{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

.body{display:grid;grid-template-columns:272px 1fr;min-height:0}

/* ---------- sidebar ---------- */
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:26px}
.rail{list-style:none;margin:0;padding:0}
.rail li{display:grid;grid-template-columns:20px 1fr;gap:11px;padding:6px 0;position:relative}
.rail li::before{content:"";position:absolute;left:9.5px;top:25px;bottom:-6px;width:1px;background:var(--line)}
.rail li:last-child::before{display:none}
.pip{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--panel);
  display:grid;place-items:center;font-size:10.5px;color:var(--dim);font-family:var(--mono);z-index:1;
}
.step-name{font-size:13.5px;color:var(--muted);line-height:1.35}
.step-note{font-size:11.5px;color:var(--dim);margin-top:2px}
li.s-complete .pip{border-color:var(--ok);color:var(--ok)}
li.s-complete .step-name{color:var(--ink)}
li.s-running .pip{border-color:var(--navy);color:var(--navy);animation:pulse 1.5s ease-in-out infinite}
li.s-running .step-name{color:var(--navy-2);font-weight:500}
li.s-pending_run .pip{border-color:var(--navy);color:var(--navy);opacity:.5}
li.s-awaiting_input .pip{border-color:var(--amber-line);background:var(--amber-wash);color:var(--amber)}
li.s-awaiting_input .step-name{color:var(--amber);font-weight:500}
li.s-failed .pip{border-color:var(--bad);color:var(--bad)}
li.s-failed .step-name{color:var(--bad)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,43,77,.22)}50%{box-shadow:0 0 0 5px rgba(29,43,77,0)}}

.artifacts{display:flex;flex-direction:column;gap:1px}
.artifact{
  display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  padding:5px 8px;border:0;border-radius:6px;background:none;text-align:left;font-size:12.5px;color:var(--muted);
}
.artifact:hover{background:var(--navy-wash);color:var(--ink)}
.artifact .v{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:0 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.toggle input{accent-color:var(--navy)}

/* ---------- main ---------- */
main{overflow:auto}
.wrap{max-width:1000px;padding:30px 34px 90px}
header.page{margin-bottom:24px}
.question{font-family:var(--serif);font-size:27px;line-height:1.25;color:var(--ink);max-width:30ch;font-weight:600}
.question{max-width:34ch}
.sub{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--dim)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px}
.card.human{border-color:var(--amber-line);box-shadow:0 1px 2px rgba(20,27,42,.04)}
.card.bad{border-color:#e3b5b1}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.card-h h2{font-size:19px}
.card-h h3{font-size:15px}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2);
}
.tag.human{border-color:var(--amber-line);background:var(--amber-wash);color:var(--amber)}
.tag.machine{border-color:#c6d0e2;background:var(--navy-wash);color:var(--navy-2)}
.tag.bad{border-color:#e3b5b1;background:#fdf1f0;color:var(--bad)}
.blurb{color:var(--muted);font-size:14px;margin:0 0 16px}

.bar{height:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:16px 0 8px}
.bar>i{display:block;height:100%;background:var(--navy);transition:width .4s ease}
.bar.indet>i{width:100%;background:linear-gradient(90deg,var(--navy-wash),var(--navy),var(--navy-wash));background-size:220% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{0%{background-position:110% 0}100%{background-position:-110% 0}}
.bar-note{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.chip b{color:var(--ink);font-weight:600}

/* options */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.opt:hover{border-color:var(--line-2)}
.opt input{margin-top:3px;accent-color:var(--navy);flex:none}
.opt.on{border-color:var(--navy-2);background:var(--navy-wash)}
.opt .lbl{font-size:14px;word-break:break-word}
.opt .lbl.q{font-size:12.5px;color:var(--navy-2)}

.rows{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.fields{display:flex;flex-direction:column;gap:9px}
.field label{display:block;margin-bottom:3px}
input[type=text],textarea,select{
  width:100%;background:var(--panel);border:1px solid var(--line-2);color:var(--ink);
  border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;
}
textarea{resize:vertical;min-height:54px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-wash)}
.icon-btn{border:1px solid var(--line-2);background:var(--panel);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12px}
.icon-btn:hover{color:var(--bad);border-color:#e3b5b1}

.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:6px;padding:9px 18px;font-size:14px;font-weight:500}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.ghost{background:var(--panel);border-color:var(--line-2);color:var(--text)}
.btn.ghost:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:default}
.err{color:var(--bad);font-size:13.5px;margin-top:10px}
.hint{color:var(--dim);font-size:12.5px}

.done-list{margin-top:30px}
.done{display:flex;align-items:center;gap:11px;padding:9px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);font-size:13.5px;margin-bottom:6px}
.done .nm{color:var(--text);flex:1}
.done .tick{color:var(--ok)}

/* ---------- map ---------- */
.map-controls{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.control{display:flex;flex-direction:column;gap:6px}
.control select{min-width:180px}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.f-chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:20px;padding:4px 12px;font-size:12.5px}
.f-chip.on{border-color:var(--navy-2);color:var(--navy-2);background:var(--navy-wash);font-weight:500}
.grid-scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table.map{border-collapse:separate;border-spacing:0;width:100%}
table.map th,table.map td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.map th{background:var(--panel-2);font-weight:500;font-size:12.5px;color:var(--muted);padding:11px 13px;text-align:left;vertical-align:bottom}
table.map thead th{position:sticky;top:0;z-index:2}
table.map tbody th{position:sticky;left:0;z-index:1;min-width:170px;max-width:230px;vertical-align:middle;color:var(--ink)}
table.map thead th:first-child{left:0;z-index:3;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
table.map td{padding:0;text-align:center;height:74px;min-width:118px}
.cell{width:100%;height:74px;border:0;background:none;display:grid;place-items:center}
.cell:hover{background:var(--navy-wash)}
.bubble{
  border-radius:50%;background:var(--navy-wash);border:1px solid #b9c5db;color:var(--navy);
  display:grid;place-items:center;font-size:12.5px;font-weight:600;transition:transform .15s;
}
.cell:hover .bubble{transform:scale(1.08)}
.cell.sel .bubble{background:var(--navy);color:#fff;border-color:var(--navy)}
.gap{color:#dfe3e9;font-size:15px}
.cell.sel.empty{background:var(--navy-wash)}

.papers{margin-top:22px}
.paper{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:15px 17px;margin-bottom:9px}
.paper .t{font-family:var(--serif);font-size:16px;line-height:1.35;color:var(--ink)}
.paper .t a{color:inherit;text-decoration:none}
.paper .t a:hover{text-decoration:underline}
.paper .m{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.paper .coord{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.coord span{font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:2px 8px;font-weight:500}
.coord span b{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:400}

/* ---------- start ---------- */
#start{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:24px;overflow:auto}
#start[hidden]{display:none}
.start-card{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:34px 36px;box-shadow:0 1px 2px rgba(20,27,42,.05)}
.start-card .brand{margin-bottom:18px}
.start-card h1{font-size:26px;margin-bottom:8px}
.start-card p.lede{color:var(--muted);font-size:14px;margin:0 0 24px;max-width:52ch}
.start-card .field{margin-bottom:18px}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.recent{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.recent button{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:7px;color:var(--text);font-size:13.5px}
.recent button:hover{border-color:var(--line-2);background:var(--panel-2)}
.recent .when{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(20,27,42,.35);display:grid;place-items:center;padding:32px;z-index:50}
#modal[hidden]{display:none}
.modal-card{width:min(880px,100%);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:22px 24px;box-shadow:0 20px 50px -20px rgba(20,27,42,.4)}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-h h2{font-size:17px}
pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.empty-state{color:var(--dim);font-size:14px;text-align:center;padding:50px 0}
</style>
</head>
<body>

<div id="start">
  <div class="start-card">
    <div class="brand"><span class="mark">R</span> Research Mapper <span class="sep">/</span> <span class="ctx">demo</span></div>
    <h1>Map the evidence on a question</h1>
    <p class="lede">The agent drafts searches, screens what it finds, and places it on an evidence map — stopping to ask you whenever a decision is yours.</p>
    <div class="field">
      <label for="q">Research question</label>
      <textarea id="q" rows="3" placeholder="What is known about HPV vaccine uptake among adolescents in school settings?"></textarea>
    </div>
    <div class="field two">
      <div>
        <label for="community">Community</label>
        <select id="community"><option value="hpv">hpv</option><option value="esea">esea</option></select>
      </div>
      <div>
        <label for="mode">Search</label>
        <select id="mode">
          <option value="both">Both</option>
          <option value="sparse">Search terms</option>
          <option value="taxonomy">Taxonomy concepts</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="go">Start mapping</button>
      <span class="hint" id="start-hint"></span>
    </div>
    <div class="recent" id="recent" hidden>
      <div class="side-h">Pick up where you left off</div>
      <div id="recent-list"></div>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="mark">R</span> Research Mapper
      <span class="sep">/</span> <span class="ctx" id="context">—</span>
    </div>
    <nav class="tabs">
      <button id="tab-run" class="on">Run</button>
      <button id="tab-map" disabled>Map</button>
    </nav>
    <div class="topmeta" id="topmeta"></div>
  </header>
  <div class="body">
    <aside>
      <div>
        <div class="side-h">Pipeline</div>
        <ul class="rail" id="rail"></ul>
      </div>
      <div>
        <div class="side-h">Artifacts</div>
        <div class="artifacts" id="artifacts"></div>
      </div>
      <div class="side-foot">
        <label class="toggle"><input type="checkbox" id="auto" checked> run the next step automatically</label>
        <button class="btn ghost" id="new-session">New session</button>
      </div>
    </aside>
    <main>
      <div class="wrap">
        <header class="page">
          <div class="question" id="question"></div>
          <div class="sub" id="sub"></div>
        </header>
        <div id="view-run"></div>
        <div id="view-map" hidden></div>
      </div>
    </main>
  </div>
</div>

<div id="modal" hidden>
  <div class="modal-card">
    <div class="modal-h"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close">close</button></div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
