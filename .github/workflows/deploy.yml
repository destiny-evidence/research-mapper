name: Deploy

on:
  push:
    # drop `infra` before merging
    branches: [main, infra]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ vars.REGISTRY_SERVER }}/${{ vars.APP_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Az CLI login
        uses: azure/login@v2.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name ${{ vars.REGISTRY_NAME }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy built image to the container app
        uses: Azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ vars.REGISTRY_NAME }}
          containerAppName: ${{ vars.CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ vars.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.IMAGE }}
