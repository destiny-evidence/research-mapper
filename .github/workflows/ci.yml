name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: research_mapper
          POSTGRES_PASSWORD: research_mapper
          POSTGRES_DB: research_mapper
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U research_mapper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run type checks
        run: |
          uv run mypy research_mapper/db research_mapper/engine \
            research_mapper/workflows \
            research_mapper/api research_mapper/commands.py

      - name: Run unit tests
        run: uv run pytest -m "not integration" --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # The deploy builds with the real endpoints; this only proves it builds.
      - name: Build
        run: npm run build
